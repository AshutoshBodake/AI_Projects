[project]
name = "lang-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashutosh B. Bodake", email = "a.b.bodake@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "bm25>=0.3.13",
    "chromadb>=1.5.9",
    "langchain>=1.4.3",
    "langchain-anthropic>=1.7.5",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-experimental>=0.4.2",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.12",
    "langsmith>=0.14.4",
    "ollama>=0.6.3",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
]

[project.scripts]
lang-course = "lang_course:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
